<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, initial-scale=1.0" />

      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"

  <body class="bg-[#FAF8F7] text-gray-800 min-h-screen pb-20 flex flex-col items-center">
    <div class="w-full px-4 sm:px-6 pt-6 md:pt-10 flex-1 flex flex-col">
      
      <!-- Header -->
      <header class="flex justify-between items-center mb-6">
        <div>
          <h1 class="font-serif-title text-2xl sm:text-3xl font-semibold text-gray-900 tracking-wide flex items-center gap-1">
            AI Stylist <span class="text-xs text-pink-400">♥</span>
          </h1>
          <p class="text-xs sm:text-sm text-gray-500 mt-1">Choose how you'd like AI to style you.</p>
        </div>
        <button class="p-2 rounded-full bg-white shadow-xs border border-gray-100 text-gray-600 hover:bg-gray-50 transition-colors">
          <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </header>

      <!-- Cards Container -->
      <main class="space-y-4 w-full flex-1">

        <!-- Card 1: Everyday Quick Look -->
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-[#FFF5F6] to-[#FDF2F4] p-5 border border-pink-100/50 flex justify-between items-center min-h-[140px] sm:min-h-[160px] shadow-xs hover:shadow-md transition-shadow">
          <div class="z-10 max-w-[55%]">
            <h2 class="font-serif-title text-lg sm:text-xl font-medium text-gray-900 leading-snug">Everyday<br>Quick Look</h2>
            <p class="text-xs text-gray-500 mt-1.5 sm:mt-2 leading-relaxed">Get effortless outfit ideas for your everyday.</p>
          </div>
          <div class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-36 sm:w-44 h-32 sm:h-36 flex items-center justify-center">
            <img src="img/everydaylook.jpg" alt="Everyday Look" class="object-contain max-h-full drop-shadow-md rounded-xl" />
          </div>
          <button onclick="window.location.href='everydaylook.html'" class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 z-10 size-8 rounded-full bg-white flex items-center justify-center shadow-md text-pink-400 hover:scale-105 transition-transform">
            ➔
          </button>
        </section>

        <!-- Card 2: Event SOS -->
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-[#FFF5F6] to-[#FDF2F4] p-5 border border-pink-100/50 flex justify-between items-center min-h-[140px] sm:min-h-[160px] shadow-xs hover:shadow-md transition-shadow">
          <div class="z-10 max-w-[55%]">
            <h2 class="font-serif-title text-lg sm:text-xl font-medium text-gray-900 leading-snug">Event SOS</h2>
            <p class="text-xs text-gray-500 mt-1.5 sm:mt-2 leading-relaxed">Need a last-minute look?<br>We've got you.</p>
          </div>
          <div class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-36 sm:w-44 h-32 sm:h-36 flex items-center justify-center">
            <img src="img/Event Sos.jpg" alt="Event SOS" class="object-contain max-h-full drop-shadow-md rounded-xl" />
          </div>
          <button onclick="window.location.href='eventsos.html'" class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 z-10 size-8 rounded-full bg-white flex items-center justify-center shadow-md text-pink-400 hover:scale-105 transition-transform">
            ➔
          </button>
        </section>

        <!-- Card 3: Trend Match -->
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-[#FFF5F6] to-[#FDF2F4] p-5 border border-pink-100/50 flex justify-between items-center min-h-[140px] sm:min-h-[160px] shadow-xs hover:shadow-md transition-shadow">
          <div class="z-10 max-w-[55%]">
            <h2 class="font-serif-title text-lg sm:text-xl font-medium text-gray-900 leading-snug">Trend Match</h2>
            <p class="text-xs text-gray-500 mt-1.5 sm:mt-2 leading-relaxed">Match your vibe with today's hottest trends.</p>
          </div>
          <div class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-36 sm:w-44 h-32 sm:h-36 flex items-center justify-center">
            <img src="img/Trend Match.jpg" alt="Trend Match" class="object-contain max-h-full drop-shadow-md rounded-xl" />
          </div>
          <button onclick="window.location.href='TrendMatch.html'" class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 z-10 size-8 rounded-full bg-white flex items-center justify-center shadow-md text-pink-400 hover:scale-105 transition-transform">
            ➔
          </button>
        </section>

        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-[#FAF3EE] to-[#F5EBE6] p-5 border border-amber-100/50 flex justify-between items-center min-h-[130px] sm:min-h-[140px] shadow-xs">

          </div>
        </section> -->
        <img src="img/ad3.jpg" alt="">
