    <h1 class="text-3xl font-semibold text-nowrap m-5">
  Good morning 🩷
  </h1>

  <div class="flex items-center justify-between mx-5 p-4 rounded-2xl bg-orange-50 shadow-sm">

  <div class="flex items-center gap-3">

      </p>

      </p>

  </div>
  <!-- รูปด้านขวา -->

  </div>
</div>

<!-- Header -->

<div class="flex flex-wrap justify-center gap-3 px-5">

  <div class="relative w-50 overflow-hidden rounded-lg shadow-sm">

        alt="Heart Icon"
      />

  <!-- Card 2 -->

      src="img/2.jpg"
      alt="Outfit 2"

      alt="Outfit 3"

        src="https://img.icons8.com/?size=100&id=85038&format=png&color=000000"
        alt="Heart Icon"
      />
    </button>
  </div>
</div>

<!-- =========================
     Recommendation Buttons
========================= -->

<div class="flex gap-3 px-5 mt-4">

  <button
    class="btn flex-1 rounded-xl
           bg-pink-50 border-none
           text-pink-500 hover:bg-pink-100"
  >
    ✓ &nbsp; Wear This!
  </button>

  <button
    class="btn flex-1 rounded-xl
           bg-pink-50 border-none
           text-pink-500 hover:bg-pink-100"

    ⇄ &nbsp; Shuffle
  </button>

</div>


<!-- =========================
     Quick Actions
========================= -->

<div class="px-5 mt-6">

  <h2 class="text-xl font-medium mb-3">
    Quick Actions
  </h2>


  <div class="grid grid-cols-2 gap-3">

    <!-- Scan Closet -->
    <button
      class="flex items-center gap-4
             rounded-xl bg-base-100
             p-4 shadow-sm text-left
             hover:bg-gray-50"
    >

      <div class="text-3xl">
        📷
      </div>

      <div>
        <p class="font-semibold">
          Scan Closet
        </p>

        <p class="text-xs text-gray-500">
          Add new clothes
        </p>
      </div>

    </button>


    <!-- Event Outfit -->
    <button
      class="flex items-center gap-4
             rounded-xl bg-base-100
             p-4 shadow-sm text-left
             hover:bg-gray-50"
    >

      <div class="text-3xl">
        🎯
      </div>

      <div>
        <p class="font-semibold">
          Event Outfit
        </p>

        <p class="text-xs text-gray-500">
          Find the perfect look
        </p>
      </div>

    </button>

  </div>

</div>


<!-- =========================
     Trend & Community Feed
========================= -->

<div class="px-5 mt-6">

  <div class="flex items-center justify-between mb-3">

    <h2 class="text-xl font-medium">
      Trend & Community Feed
    </h2>

    <button class="btn btn-ghost btn-sm">

    </button>

  </div>


  <div class="grid grid-cols-2 gap-3">

    <!-- Trending -->
    <div class="rounded-2xl bg-pink-50 p-4">

      <p class="font-semibold">
        What's Trending Now 🔥
      </p>

      <div class="flex items-center gap-3 mt-3">

        <img
          src="img/1.jpg"
          class="w-20 h-20 rounded-lg object-cover"
          alt="Trending"
        />

        <div>

          <p class="font-medium text-sm">
            Y2K Denim style
          </p>

          <p class="text-xs text-gray-500 mt-1">
            is taking over!
          </p>

        </div>

      </div>

    </div>


    <!-- Inspiration -->
    <div class="rounded-2xl bg-pink-50 p-4">

      <p class="font-semibold">
        Item Inspiration
      </p>

      <p class="text-sm text-gray-500 mt-3">
        How others style
      </p>

      <p class="font-medium text-sm">
        This White Tee
      </p>

      <button
        class="btn btn-sm mt-3
               rounded-full
               bg-pink-100
               border-none
               text-pink-500"
      >
        View Inspiration
      </button>

    </div>

  </div>

</div>
