<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="pb-24">
    <div class="navbar bg-base-100 shadow-sm ">
      <div class="navbar-start">
        <button onclick="window.parent.history.back()" class="btn btn-circle">
        <img class="size-[1.5em]" src="https://img.icons8.com/?size=100&id=84&format=png&color=000000" alt="">
</button>
      </div>
      <div class="navbar-center">
        <a class="btn btn-ghost text-xl">Everyday Quick Look</a>
      </div>
      <div class="navbar-end">
        <div class="dropdown dropdown-bottom dropdown-end">
  <div tabindex="0" role="button" class="btn btn-circle m-1"><img class="size-[1.5em]" src="https://img.icons8.com/?size=100&id=36389&format=png&color=000000" alt=""></div>
  <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
    <li><a>Item 1</a></li>
    <li><a>Item 2</a></li>
  </ul>
</div>
      </div>
    </div>

    <main class="w-full max-w-5xl mx-auto px-4 pb-28">

  <!-- Header Outfit -->
  <div class="flex items-center gap-6 py-6">

    <!-- Left Content -->
    <div class="w-2/5">

      <p class="text-base md:text-lg leading-relaxed mb-8">
        A quick, effortless outfit idea just for your day. ✨
      </p>

      <!-- AI Match -->
      <div class=" bg-white rounded-2xl p-5 shadow-sm border mb-4">
        <div class="flex items-center justify-between">

          <div>
            <p class="text-lg font-medium">AI Match</p>
            <p class="text-3xl font-semibold mt-2">96%</p>
          </div>

          <!-- Circle -->
          <div
  class="radial-progress ai-progress text-pink-400 shrink-0"
  style="--value:96;"
  role="progressbar"
  aria-valuenow="96"
>
  ✦
</div>

        </div>
      </div>

      <!-- Weather -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border">

        <div class="flex items-center justify-between">

          <div>
            <p class="text-lg font-medium">Weather</p>
            <p class="text-3xl mt-2">32°C</p>
            <p class="text-gray-500 mt-1">Sunny</p>
          </div>
          <div class="text-4xl">
            <img src="https://img.icons8.com/?size=100&id=648&format=png&color=FD7E14" alt="">
          </div>
        </div>

      </div>

    </div>


    <!-- Outfit Image -->
    <div class="w-3/5 max-w-md ml-auto">

      <img
        src="img/evd1.jpg"
        alt="Everyday outfit"
        class="w-full aspect-[3/4] object-cover rounded-3xl"
      >

    </div>

  </div>


  <!-- Items -->
  <section class="mt-6">

    <h2 class="text-2xl font-semibold mb-4">
      Items <span class="text-pink-400">♥</span>
    </h2>


    <!-- White Tee -->
    <div class="flex items-center bg-white border rounded-2xl p-3 mb-3
                hover:shadow-sm transition">

      <img
        src="img/whitetee.jpg"
        alt="White Tee"
        class="w-24 h-24 object-cover rounded-xl"
      >

      <div class="ml-4 flex-1">

        <p class="text-lg font-medium">
          White Tee
        </p>

        <p class="text-gray-500">
          Tops
        </p>

      </div>

      <span class="text-2xl mr-3">
        ›
      </span>

    </div>


    <!-- Blue Jeans -->
    <div class="flex items-center bg-white border rounded-2xl p-3 mb-3
                hover:shadow-sm transition">

      <img
        src="img/bluejeans.jpg"
        alt="Blue Jeans"
        class="w-24 h-24 object-cover rounded-xl"
      >

      <div class="ml-4 flex-1">

        <p class="text-lg font-medium">
          Blue Jeans
        </p>

        <p class="text-gray-500">
          Bottoms
        </p>

      </div>

      <span class="text-2xl mr-3">
        ›
      </span>

    </div>


    <!-- White Sneakers -->
    <div class="flex items-center bg-white border rounded-2xl p-3 mb-5
                hover:shadow-sm transition">

      <img
        src="img/whitesneakers.jpg"
        alt="White Sneakers"
        class="w-24 h-24 object-cover rounded-xl"
      >

      <div class="ml-4 flex-1">

        <p class="text-lg font-medium">
          White Sneakers
        </p>

        <p class="text-gray-500">
          Shoes
        </p>

      </div>

      <span class="text-2xl mr-3">
        ›
      </span>

    </div>

  </section>


  <!-- Buttons -->
  <div class="grid grid-cols-3 gap-3 mb-5">

    <button class="btn bg-pink-400 hover:bg-pink-500 text-white border-none
                   rounded-xl h-14">
      ♧
      <span>Wear This</span>
    </button>

    <button class="btn bg-pink-50 hover:bg-pink-100
                   text-pink-400 border-none rounded-xl h-14">
      ⇄
      <span>Shuffle</span>
    </button>

    <button class="btn bg-orange-50 hover:bg-orange-100
                   text-gray-700 border-none rounded-xl h-14">
      ♧
      <span>Save Outfit</span>
    </button>

  </div>


  <!-- Advertisement -->
  <div class="relative overflow-hidden rounded-2xl
              bg-[#f8eee9] min-h-40">
      <img src="img/ad4.jpg" alt="">
</main>

</div>
